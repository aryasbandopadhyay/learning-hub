name: CI

# Build + test on every push and pull request to the main branches.
# Runs fully offline of any cloud: the Spring Boot services degrade to in-memory stores when no
# Azure connection string is present, so no secrets are needed and there is zero cloud cost.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Spring Boot build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & run unit tests
        working-directory: learning-hub
        run: mvn -B --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: learning-hub/target/surefire-reports/
          if-no-files-found: ignore

  judge:
    name: Judge runner tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run judge sandbox & grading tests
        working-directory: learning-hub/judge
        run: python -m pytest test_runner.py -q

# ============================================================================================
# application.properties — Spring Boot's externalized configuration.
# ============================================================================================
# Spring Boot auto-loads this file from the classpath (src/main/resources) at startup and binds
# these keys to the framework's configuration beans. You change behavior WITHOUT touching Java.
# ============================================================================================

# ---- Application ---------------------------------------------------------------------------
spring.application.name=crud-demo

# ---- Datasource: an in-memory H2 database --------------------------------------------------
# jdbc:h2:mem:<name> => a database that lives only in RAM and disappears when the app stops.
# DB_CLOSE_DELAY=-1 keeps the DB alive as long as the JVM runs (so it isn't dropped between
# connections). This is ideal for demos and tests.
spring.datasource.url=jdbc:h2:mem:crud_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate (the ORM) -------------------------------------------------------------
# ddl-auto=create-drop => Hibernate creates the schema from your @Entity classes at startup and
# drops it at shutdown. Great for learning; NEVER use in production (use migrations instead).
spring.jpa.hibernate.ddl-auto=create-drop
# Log the SQL Hibernate generates, nicely formatted — so you can SEE what JPA does under the hood.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console ------------------------------------------------------------------------
# Browse the live in-memory DB at http://localhost:8080/h2-console
# (use JDBC URL jdbc:h2:mem:crud_demo, user 'sa', empty password).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

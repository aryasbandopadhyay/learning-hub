<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Learning Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230; --border: #2a313c;
      --text: #e6edf3; --muted: #9aa4b2; --accent: #58a6ff; --accent-2: #7c8cff;
      --danger: #f85149; --accent-glow: rgba(88,166,255,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 20% -10%, #16203a 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #1b1330 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--border); border-radius: 16px;
      padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: rise .35s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 22px; margin-bottom: 4px; }
    .brand .mark { filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .brand .txt {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 13px; font-size: 14px;
      background: #0f141b; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.18); }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
    button {
      width: 100%; margin-top: 22px; padding: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      color: #fff; border: none; border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: transform .12s ease, box-shadow .2s ease;
    }
    button:hover { box-shadow: 0 6px 20px var(--accent-glow); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .6; cursor: progress; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.err { color: var(--danger); }
    .foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="mark">📚</span><span class="txt">Learning Hub</span></div>
    <p class="sub">Sign in to continue</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus />

    <label for="password">Password <span style="font-weight:400">(admin only)</span></label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Leave blank if you're a guest" />
    <div class="hint">Approved guests sign in with just their email — no password needed.</div>

    <button id="submit" type="submit">Sign in →</button>
    <div class="msg" id="msg"></div>

    <div class="foot">Access is invite-only. If you can't get in, ask the admin to add your email.</div>
  </form>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "msg";
      btn.disabled = true;
      btn.textContent = "Signing in…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.authenticated) {
          msg.className = "msg";
          msg.style.color = "#3fb950";
          msg.textContent = "Welcome! Redirecting…";
          window.location.href = "/";
          return;
        }
        msg.className = "msg err";
        msg.textContent = data.error || "Sign in failed.";
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Network error. Please try again.";
      }
      btn.disabled = false;
      btn.textContent = "Sign in →";
    });
  </script>
</body>
</html>
